# hypersync gateway + peerd as their own compose project.
#
# The gateway serves MULTIPLE downstream hl-nodes (sessions are keyed by the node's source IP —
# one node per egress IP; two nodes NAT'd through one IP would be conflated). It reads no node
# files: gw needs only /pd (peers.json + bootstrap.cache), peerd discovers upstream peers via the
# gossipRootIps API + probing.
#
# Deployment modes:
#   co-located (nodes on this machine):  node compose projects join the attachable gwnet below
#     as an external network (name: hypersync_gwnet) and dial the gw's static IP 172.28.0.10.
#     Leave gw `ports:` disabled. The host's public 4001/4002 are answered either by the node
#     or, with `--profile public`, by the responder below (then the node publishes no ports).
#     Container-internal 4001/4002 do not conflict with the node.
#     Optionally add stats harvesting: docker compose -f docker-compose.yml \
#       -f docker-compose.colocated.yml up -d
#   remote (nodes on other machines):    expose gw only on a PRIVATE/VPN interface and firewall
#     to node IPs. If a real HL node also runs on this host, it cannot already bind
#     0.0.0.0:4000-4010; bind the node to the public IP and gw to the private/VPN IP. A
#     gateway-only public IP without real HL node 4001/4002 behavior may be deprioritized by
#     upstream peers: run the responder below (`--profile public`) on it.
#
# Env (.env): HL_SELF_IP = comma-separated public IPs of ALL your nodes (keeps your own nodes out
# of the upstream pool — otherwise the gateway can end up relaying your nodes to each other).

name: hypersync

networks:
  gwnet:
    driver: bridge
    attachable: true # co-located node projects + fakenode test containers join this
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25 # dynamic pool; keeps .10 safe from races
          gateway: 172.28.0.1

services:
  gw:
    image: hypersync:latest
    build: .
    container_name: hypersync-gw
    restart: unless-stopped
    # only matters with --cache: worst case ~3 bootstraps in memory (~5.8G each in 2026-10) =
    # cache blob + 1 refresh capture + the single-flight fallback tap, or 2 cold captures + tap,
    # ≈ 17.4G. Concurrent replays to N nodes share one Arc'd blob. Without --cache the gateway
    # uses a few MB (+64MB per in-flight bootstrap).
    mem_limit: 24g
    stop_grace_period: 30s
    networks:
      gwnet:
        ipv4_address: 172.28.0.10 # THE well-known gw address; static, outside ip_range
    environment:
      # Tier P (see docs/hypersync-quicknode-upgrade-plan.html): stand-in public peers now, the
      # QuickNode sentry roots on swap day. Set in .env (gitignored), never here. Empty = off.
      HYPERSYNC_PRIORITY_PEERS: "${HYPERSYNC_PRIORITY_PEERS:-}"
      # how many priority peers there must be: set, a missing or short list stops startup
      HYPERSYNC_PRIORITY_PEERS_EXPECTED: "${HYPERSYNC_PRIORITY_PEERS_EXPECTED:-}"
      HYPERSYNC_PRIORITY_EXCLUSIVE: "${HYPERSYNC_PRIORITY_EXCLUSIVE:-1}"
      # empty = prefer on an exclusive tier, fallback on a staged one
      HYPERSYNC_PRIORITY_BOOTSTRAP: "${HYPERSYNC_PRIORITY_BOOTSTRAP:-}"
      HYPERSYNC_PRIORITY_MAX_SESSIONS: "${HYPERSYNC_PRIORITY_MAX_SESSIONS:-0}"
      HYPERSYNC_PRIORITY_STAGE_MS: "${HYPERSYNC_PRIORITY_STAGE_MS:-1500}"
      # IPs never dialed; also read from /pd/ip_blacklist.txt (= ./data/ip_blacklist.txt, re-read
      # every 30s)
      HYPERSYNC_IP_BLACKLIST: "${HYPERSYNC_IP_BLACKLIST:-}"
      # hot-standby failover (README "Hot-standby failover"); 0 standbys = off
      HYPERSYNC_FAILOVER_STANDBYS: "${HYPERSYNC_FAILOVER_STANDBYS:-0}"
      # pace reference stream for the lagging-peer guard (README "Dropping a peer"); 0 = off
      HYPERSYNC_REFERENCE_STREAM: "${HYPERSYNC_REFERENCE_STREAM:-1}"
      HYPERSYNC_FAILOVER_STALL_MS: "${HYPERSYNC_FAILOVER_STALL_MS:-400}"
      HYPERSYNC_FAILOVER_LAG_MS: "${HYPERSYNC_FAILOVER_LAG_MS:-150}"
      HYPERSYNC_FAILOVER_STATUS_DIR: "${HYPERSYNC_FAILOVER_STATUS_DIR:-}"
    volumes:
      - ./data:/pd
    # same args as the image CMD. --cache is opt-in (append "--cache" here to enable it): the
    # in-memory snapshot cache + its 4-min refresh races held 6-19 GiB, and next to a ~34 GiB
    # hl-node that pushed host memory past hl-visor's ~95% low-memory restart threshold
    # (2026-10-12 soak: 5 child restarts). Node cold-starts then bootstrap transparently via a peer.
    command: ["gateway", "/pd/peers.json", "--push"]
    # remote mode ONLY — bind to a private/VPN interface and firewall to node IPs.
    # Never publish gw on the same public 4001/4002 that belongs to the real HL node:
    # ports:
    #   - "${GW_BIND_IP:?set GW_BIND_IP to a private interface IP}:4000-4010:4000-4010"

  # The only public listener (README "Public probe responder"): answers upstream peers' probes of
  # this host's 4001/4002 so the nodes need no public ports. Opt-in, because it takes the host
  # ports a node publishes: stop publishing them from the node, then
  #   docker compose --profile public up -d responder
  responder:
    image: hypersync:latest
    container_name: hypersync-responder
    restart: unless-stopped
    profiles: ["public"]
    mem_limit: 256m
    command: ["responder"]
    environment:
      # only to count probes from priority peers; never logged as addresses
      HYPERSYNC_PRIORITY_PEERS: "${HYPERSYNC_PRIORITY_PEERS:-}"
      HYPERSYNC_PRIORITY_PEERS_EXPECTED: "${HYPERSYNC_PRIORITY_PEERS_EXPECTED:-}"
    # on every address (IPv4 and IPv6) by default; set HYPERSYNC_RESPONDER_BIND (.env) to the public IP when the
    # gateway is also published on this host (e.g. on a VPN address for remote nodes)
    ports:
      - "${HYPERSYNC_RESPONDER_BIND:+${HYPERSYNC_RESPONDER_BIND}:}4001:4001"
      - "${HYPERSYNC_RESPONDER_BIND:+${HYPERSYNC_RESPONDER_BIND}:}4002:4002"

  peerd:
    image: hypersync:latest
    container_name: hypersync-peerd
    restart: unless-stopped
    mem_limit: 1g
    command: ["peerd", "120"]
    environment:
      HYPERSYNC_DATA: /pd
      # comma-separated list of ALL our nodes' public IPs (never dialed as upstream peers)
      HL_SELF_IP: "${HL_SELF_IP:-}"
      # priority peers are excluded from discovery/probing (the gateway judges them itself)
      HYPERSYNC_PRIORITY_PEERS: "${HYPERSYNC_PRIORITY_PEERS:-}"
      HYPERSYNC_PRIORITY_PEERS_EXPECTED: "${HYPERSYNC_PRIORITY_PEERS_EXPECTED:-}"
      # never queried, probed or published (plus /pd/ip_blacklist.txt, re-read every cycle)
      HYPERSYNC_IP_BLACKLIST: "${HYPERSYNC_IP_BLACKLIST:-}"
      # optional, comma-separated tcp_lz4_stats dirs (co-located only; see the colocated overlay)
      HL_STATS_DIR: "${HL_STATS_DIR:-}"
      # trim the steady-state pool: ~90 live peers is plenty of rotation headroom for cache refresh
      # and active-lag detection while cutting probe traffic ~2.7x vs the 256 default
      PEERD_PROBE_MAX_PER_CYCLE: "96"
      PEERD_CRAWL_MAX_QUERIES: "50"
      PEERD_CRAWL_DEPTH: "2"
    networks:
      - gwnet
    volumes:
      - ./data:/pd
