[package]
name = "hypersync"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[[bin]]
name = "hypersync"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "process", "fs"] }
lz4_flex = "0.11"
hotpath = { version = "0.19", optional = true }

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
# allocation profiling on top of hotpath (the hotpath::main macro checks for this feature)
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
